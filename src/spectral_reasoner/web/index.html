<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpectralReasoner</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #5c6673;
      --line: #d7dee7;
      --panel: #ffffff;
      --page: #f5f7fa;
      --accent: #0f766e;
      --accent-2: #b45309;
      --bad: #b91c1c;
      --good: #047857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
    }
    .bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 16px;
    }
    section, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    section {
      padding: 14px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 10px 0 5px;
    }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }
    textarea { min-height: 92px; }
    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      min-height: 40px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 14px;
      background: var(--accent);
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
    }
    button:disabled {
      opacity: 0.55;
      cursor: progress;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 66px;
      background: #fbfcfe;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      line-height: 1.15;
      word-break: break-word;
    }
    .answer {
      margin: 12px 0;
      padding: 12px;
      border-left: 4px solid var(--accent);
      background: #eefaf8;
      border-radius: 6px;
      word-break: break-word;
    }
    .answer.refused {
      border-color: var(--bad);
      background: #fff1f2;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fff;
    }
    .item .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      background: #edf2f7;
      color: var(--muted);
      white-space: nowrap;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; padding: 10px; }
      .row { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .bar { padding: 10px; }
      h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <h1>SpectralReasoner</h1>
        <div class="sub">Subword LM + SpectralReasoner + OSU Memory</div>
      </div>
      <span id="health" class="pill">checking</span>
    </div>
  </header>
  <main>
    <section>
      <h2>请求</h2>
      <label for="prompt">Prompt</label>
      <textarea id="prompt">问题：香港在哪里？ 答案：</textarea>
      <label for="kind">Kind</label>
      <input id="kind" value="known">
      <label for="chatDocs">Chat docs，每段一行；留空时使用服务端内置知识库</label>
      <textarea id="chatDocs"></textarea>
      <div class="actions">
        <button id="chatRun">开放式聊天</button>
        <button id="genRun" class="secondary">生成式聊天</button>
        <button id="demo" class="secondary">重置示例</button>
        <span id="status" class="status"></span>
      </div>
    </section>
    <aside class="panel">
      <section>
        <h2>结果</h2>
        <div id="answer" class="answer">等待请求</div>
        <div class="metrics">
          <div class="metric"><span>Risk</span><strong id="risk">-</strong></div>
          <div class="metric"><span>Confidence</span><strong id="confidence">-</strong></div>
          <div class="metric"><span>Route</span><strong id="route">-</strong></div>
          <div class="metric"><span>LM calls</span><strong id="calls">-</strong></div>
        </div>
      </section>
      <section>
        <h2>候选排序</h2>
        <div id="candidateList" class="list"></div>
      </section>
      <section>
        <h2>谱迹</h2>
        <pre id="trace">{}</pre>
      </section>
    </aside>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const defaults = {
      prompt: $("prompt").value,
      chatDocs: $("chatDocs").value
    };
    function lines(value) {
      return value.split(/\n+/).map((x) => x.trim()).filter(Boolean);
    }
    function num(value) {
      return Number.isFinite(value) ? value.toFixed(3) : "-";
    }
    async function health() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        $("health").textContent = data.ok ? "online" : "offline";
      } catch {
        $("health").textContent = "offline";
      }
    }
    async function chat() {
      $("chatRun").disabled = true;
      $("status").textContent = "chat running";
      try {
        const payload = {
          messages: [{role: "user", content: $("prompt").value.replace(/^问题：/, "").replace(/答案：\s*$/, "").trim()}],
          docs: lines($("chatDocs").value),
          max_candidates: 8,
          kind: $("kind").value || "known"
        };
        const res = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "request failed");
        const r = data.response;
        $("answer").className = "answer" + (r.refused ? " refused" : "");
        $("answer").textContent = r.refused ? "拒答：证据不足" : (r.answer || "无答案");
        $("risk").textContent = num(r.risk);
        $("confidence").textContent = num(r.confidence);
        $("route").textContent = r.route || "-";
        $("calls").textContent = num(r.spectral_trace?.lm_forward_calls);
        $("trace").textContent = JSON.stringify(r.spectral_trace || {}, null, 2);
        $("candidateList").innerHTML = "";
        for (const c of r.candidates || []) {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<div class="top"><strong></strong><span class="pill"></span></div><pre></pre>`;
          div.querySelector("strong").textContent = c.answer;
          div.querySelector(".pill").textContent = `prior ${num(c.prior)}`;
          div.querySelector("pre").textContent = `value ${num(c.value)} | visits ${num(c.visits)} | evidence ${num(c.evidence_hit)}`;
          $("candidateList").appendChild(div);
        }
        $("status").textContent = "done";
      } catch (err) {
        $("answer").className = "answer refused";
        $("answer").textContent = String(err.message || err);
        $("status").textContent = "error";
      } finally {
        $("chatRun").disabled = false;
      }
    }
    async function generateChat() {
      $("chatRun").disabled = true;
      $("genRun").disabled = true;
      $("status").textContent = "generating";
      try {
        const payload = {
          messages: [{role: "user", content: $("prompt").value.replace(/^问题：/, "").replace(/答案：\s*$/, "").trim()}],
          docs: lines($("chatDocs").value),
          generated_candidates: 6,
          max_new_tokens: 48,
          temperature: 0.9,
          top_k: 40,
          kind: $("kind").value || "known"
        };
        const res = await fetch("/generate-chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "request failed");
        const r = data.response;
        $("answer").className = "answer" + (r.refused ? " refused" : "");
        $("answer").textContent = r.refused ? "拒答：生成风险过高或证据不足" : (r.answer || "无答案");
        $("risk").textContent = num(r.risk);
        $("confidence").textContent = num(r.confidence);
        $("route").textContent = r.route || "-";
        $("calls").textContent = num(r.spectral_trace?.lm_forward_calls);
        $("trace").textContent = JSON.stringify(r.spectral_trace || {}, null, 2);
        $("candidateList").innerHTML = "";
        for (const c of r.candidates || []) {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<div class="top"><strong></strong><span class="pill"></span></div><pre></pre>`;
          div.querySelector("strong").textContent = c.answer;
          div.querySelector(".pill").textContent = `prior ${num(c.prior)}`;
          div.querySelector("pre").textContent = `value ${num(c.value)} | visits ${num(c.visits)} | evidence ${num(c.evidence_hit)}`;
          $("candidateList").appendChild(div);
        }
        $("status").textContent = "done";
      } catch (err) {
        $("answer").className = "answer refused";
        $("answer").textContent = String(err.message || err);
        $("status").textContent = "error";
      } finally {
        $("chatRun").disabled = false;
        $("genRun").disabled = false;
      }
    }
    $("chatRun").addEventListener("click", chat);
    $("genRun").addEventListener("click", generateChat);
    $("demo").addEventListener("click", () => {
      $("prompt").value = defaults.prompt;
      $("chatDocs").value = defaults.chatDocs;
    });
    health();
  </script>
</body>
</html>
